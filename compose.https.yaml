services:
  relakeep:
    environment:
      RELAKEEP_TRUST_PROXY: "true"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: selfhost.env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
