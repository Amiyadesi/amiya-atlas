<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加入 Atlas</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="mark">A</div><div><strong>Amiya Atlas</strong><span>捕获当前网站</span></div></header>
  <main>
    <div id="page" class="page">正在读取当前网页…</div>
    <label>登录身份<select id="identity"><option value="">正在连接 Atlas…</option></select></label>
    <p id="error" class="error"></p>

    <p class="hint">只读取网页标题和地址。不会读取密码、Cookie 或表单内容。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
