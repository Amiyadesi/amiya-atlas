      <text x="18" y="30" fill="#796B85" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">电话卡 · SIM</text>
      <text x="18" y="55" fill="#363246" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">S 备用号码</text>
      <text x="18" y="75" fill="#786B84" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">尾号 0826 · 找回绑定</text>
    </g>

    <!-- Slip 4: Card -->
    <g transform="translate(262, 330) rotate(-2)">
      <rect width="176" height="90" rx="8" fill="#E2F0E8" stroke="#B4D2C0" stroke-width="1.5"/>
      <circle cx="88" cy="9" r="4" fill="#8F82A3"/>
      <text x="18" y="30" fill="#5A7A68" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">付款卡 · Card</text>
      <text x="18" y="55" fill="#363246" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">C 日常付款卡</text>
      <text x="18" y="75" fill="#5A7A68" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">尾号 1234 · 自动续费</text>
